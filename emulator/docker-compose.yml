# docker compose -f emulator/docker-compose.yml up --build   (ports bound to 127.0.0.1)
#   http://localhost:8080  the emulated screen
#   http://localhost:8000  the clock's settings page and API (firmware port 80)
#   http://localhost:8790  the stand-in OpenClaw Gateway's control API (the OpenClaw panel)
services:
  smartclock:
    build:
      context: ..
      dockerfile: emulator/Dockerfile
    ports:   # this computer only: port 8080 serves the clock's storage
      - "127.0.0.1:8000:80"
      - "127.0.0.1:8080:8080"
    volumes:
      - clock-data:/data   # storage, EEPROM: survives restarts and rebuilds
    environment:   # EMU_HEAPMAP=0 turns the page's heap map off (every allocation is unwound)
      EMU_HEAPMAP: ${EMU_HEAPMAP:-1}
    restart: unless-stopped
  gateway:   # a stand-in OpenClaw Gateway (spec 043): the screen page's OpenClaw panel, "gateway" to the clock
    image: python:3.12-alpine
    command: python -u /gw/openclaw_gateway.py
    volumes:
      - ./openclaw_gateway.py:/gw/openclaw_gateway.py:ro
    ports:   # its control API, for the screen page (this computer only)
      - "127.0.0.1:8790:8790"
    restart: unless-stopped
  openclaw:   # the real OpenClaw Gateway, optional: add --profile openclaw (emulator/README.md, "OpenClaw")
    image: ghcr.io/openclaw/openclaw:latest   # tried with 2026.11.1; no model provider needed for nodes
    profiles: ["openclaw"]
    command: ["node", "openclaw.mjs", "gateway", "--dev", "--allow-unconfigured", "--bind", "lan", "--auth", "token", "--port", "18789"]
    environment:
      OPENCLAW_GATEWAY_TOKEN: emulator-token   # the clock pairs with token:emulator-token
    volumes:
      - openclaw-home:/home/node/.openclaw   # its config, approvals and devices
    ports:   # its Control UI, for this computer only
      - "127.0.0.1:18789:18789"
    restart: unless-stopped

volumes:
  clock-data:
  openclaw-home:
