name: Release

# Every push to main releases FW_VERSION (src/main.cpp) if it has no release yet: bump
# FW_VERSION and add its "## <version>" CHANGELOG section, and the push publishes
# v<version> (the tag is created on the pushed commit). Pushes with a released version
# only run the checks in build.yml. Run by hand from the Actions tab to retry.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pages: write      # the .update file on GitHub Pages (spec 048)
  id-token: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Is FW_VERSION released yet?
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^#define FW_VERSION "\([^"]*\)".*/\1/p' src/main.cpp | tr -d '\r')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "FW_VERSION $version is a pre-release: not published"; echo "new=false" >> "$GITHUB_OUTPUT"; exit 0;; esac
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released: nothing to do"; echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.version.outputs.new == 'true'
        with:
          python-version: "3.12"

      - name: Install PlatformIO, Zig, Pillow and zopfli
        if: steps.version.outputs.new == 'true'
        run: pip install platformio==6.2.0 ziglang==0.13.0 pillow zopfli==0.4.3

      - uses: actions/setup-node@v4   # the settings page is minified by terser (spec 036)
        if: steps.version.outputs.new == 'true'
        with:
          node-version: "20"

      - name: Put Zig on PATH
        if: steps.version.outputs.new == 'true'
        run: python -c "import os, ziglang; print(os.path.dirname(ziglang.__file__))" >> "$GITHUB_PATH"

      # The release build: no WiFi details; only the plain first-install image is named
      # for the stock update page (SDP...).
      - name: Build the release image
        if: steps.version.outputs.new == 'true'
        run: python scripts/make_release.py

      - name: Unit tests
        if: steps.version.outputs.new == 'true'
        run: python tests/unit/run_unit_tests.py

      - name: Safety tests (on the release image)
        if: steps.version.outputs.new == 'true'
        run: python tests/run_safety_tests.py

      - name: Face preview
        if: steps.version.outputs.new == 'true'
        run: python tests/face_preview/run_face_preview.py

      - name: Release notes from CHANGELOG.md
        if: steps.version.outputs.new == 'true'
        run: |
          tr -d '\r' < CHANGELOG.md | awk -v v="${{ steps.version.outputs.version }}" '
            $0 ~ "^## " v "( |$)" { on = 1; next }
            on && /^## / { exit }
            on { print }' > notes.md
          if [ ! -s notes.md ]; then echo "No '## ${{ steps.version.outputs.version }}' section in CHANGELOG.md" >&2; exit 1; fi
          # Every release page says how a new clock gets its first install (spec 048).
          cat >> notes.md <<'EOF'

          ### Which file
          - **A clock on the stock firmware:** install `SDPro_AIAgentMonitor_starter_v<v>.bin`
            from the clock's own update page, join its setup network, and press Install: it
            downloads and installs this release itself.
          - **AI Agent Monitor 2.5.0 or later:** Settings > Firmware update > Install, or the
            `.update` file by hand.
          - **AI Agent Monitor 1.4.0 to 2.4.x:** the `.bin.gz`, then Install on the setup page
            that comes up (or the `.update` file).
          See the README's Install section.
          EOF
          sed -i "s/<v>/${{ steps.version.outputs.version }}/" notes.md
          sed -i 's/^          //' notes.md

      - name: Publish the release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" --target "$GITHUB_SHA" \
            release/*.update release/*.bin.gz release/*.bin release/*.elf release/SHA256SUMS.txt \
            --title "AI Agent Monitor ${{ steps.version.outputs.version }}" --notes-file notes.md

      # The settings page's Install button downloads the .update from GitHub Pages: a
      # browser cannot fetch a release download (no CORS header; spec 048's RESEARCH).
      # Pages must be on, once: Settings > Pages > Source: GitHub Actions.
      - name: The .update file for GitHub Pages
        if: steps.version.outputs.new == 'true'
        run: |
          mkdir -p site/update
          cp release/*.update site/update/
          printf '{"version":"%s","file":"AIAgentMonitor_v%s.update"}\n' \
            "${{ steps.version.outputs.version }}" "${{ steps.version.outputs.version }}" > site/update/latest.json
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        if: steps.version.outputs.new == 'true'
        with:
          path: site

    outputs:
      new: ${{ steps.version.outputs.new }}

  pages:
    needs: release
    if: needs.release.outputs.new == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
