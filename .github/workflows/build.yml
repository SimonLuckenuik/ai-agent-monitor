name: Build and test

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  firmware:
    name: Firmware, safety tests and face preview
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            .pio/libdeps
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO, Zig, Pillow and zopfli
        run: pip install platformio==6.2.0 ziglang==0.13.0 pillow zopfli==0.4.3

      - uses: actions/setup-node@v7   # the settings page is minified by terser (spec 036)
        with:
          node-version: "24"

      - name: Put Zig on PATH
        run: python -c "import os, ziglang; print(os.path.dirname(ziglang.__file__))" >> "$GITHUB_PATH"

      - name: Build the firmware (fails above the OTA size budget)
        run: pio run

      - name: Build the starter (fails above the plain-image limit; spec 048)
        run: pio run -e starter

      - name: Unit tests
        run: python tests/unit/run_unit_tests.py

      - name: Safety tests
        run: python tests/run_safety_tests.py

      - name: Face preview
        run: python tests/face_preview/run_face_preview.py

      - uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ github.sha }}
          path: |
            .pio/build/esp12e/firmware.bin
            .pio/build/esp12e/firmware.bin.gz
            .pio/face-preview/sheet.png
          if-no-files-found: error

  emulator:
    name: Emulator and integration tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: pip install pillow
      - name: Integration tests (builds the emulator image)
        run: python tests/integration/run_integration_tests.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-screens-${{ github.sha }}
          path: .pio/integration/

  plugin:
    name: Claude Code plugin
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Manifests and the face schema
        run: |
          pip install jsonschema
          python - <<'EOF'
          import json, jsonschema
          for path in [".claude-plugin/marketplace.json", "plugins/ai-agent-monitor/.claude-plugin/plugin.json",
                       "examples/faces/samples.json"]:
              json.load(open(path, encoding="utf-8"))
          schema = json.load(open("plugins/ai-agent-monitor/skills/ai-agent-monitor/reference/face.schema.json"))
          jsonschema.Draft202012Validator.check_schema(schema)
          print("ok")
          EOF

      - name: Example faces against the schema
        run: |
          python plugins/ai-agent-monitor/skills/ai-agent-monitor/scripts/clock.py check \
            plugins/ai-agent-monitor/skills/ai-agent-monitor/examples/*.json \
            $(ls examples/faces/*.json examples/faces/smalltv-pomodoro/*.json | grep -v -e samples.json -e marketplace.json -e faces.json)

      - name: Session status hooks
        run: python tests/plugin/session_status_test.py

      - name: The skill's face format matches the specification
        run: python scripts/gen_face_format.py --check

      - name: The OpenClaw skill's copies match the Claude Code skill
        run: python scripts/gen_openclaw_skill.py --check

      - name: The big font's compiled glyphs match their source
        run: python scripts/gen_mono_glyphs.py --check

      - name: The face gallery lists every example face, each with its preview
        run: python scripts/gen_marketplace.py --check

      - name: The settings page's time zone rules (spec 033)
        run: node tests/web/tz_rules.test.js

      - name: The settings page's backups with the custom faces (spec 032)
        run: node tests/web/backup.test.js

      - name: The minified settings page keeps every handler (spec 036)
        run: node tests/web/minified_page.test.js

      - name: Local time without newlib's tzset, against glibc (spec 036)
        run: |
          node tests/tz/zone_rules.js > tz_rules.txt
          g++ -O2 -std=c++17 -Wall -I src tests/tz/tz_rule_tests.cpp -o tz_rule_tests
          ./tz_rule_tests tz_rules.txt
