# The integration tests' own emulator: other ports, and storage that `down -v` wipes,
# so each run starts from a blank clock and leaves the development emulator alone.
#   docker compose -p aam-itest -f tests/integration/docker-compose.yml up -d --build
services:
  smartclock:
    build:
      context: ../..
      dockerfile: emulator/Dockerfile
    ports:
      - "127.0.0.1:18000:80"
      - "127.0.0.1:18080:8080"
    volumes:
      - clock-data:/data
    environment:
      EMU_MINUTE_MS: "1000"   # a firmware minute is a second: the setup network's and recovery's timers (spec 046)
      EMU_SEED_FILES: "0"     # no settings-page files until a case installs them (spec 048)
  starter:   # a clock fresh from stock, on the starter (spec 048): the starter case
    build:
      context: ../..
      dockerfile: emulator/Dockerfile
    ports:
      - "127.0.0.1:18100:80"
      - "127.0.0.1:18180:8080"
    volumes:
      - starter-data:/data
    environment:
      EMU_FIRMWARE: starter
      EMU_HEAP: "44000"   # the starter's free heap on the chip (RAM 31.5 KB in use, not 50)
  broker:   # an MQTT broker for the mqtt_and_mdns case (spec 025), as "broker" to the clock
    image: eclipse-mosquitto:2.0.18
    command: mosquitto -c /mosquitto-no-auth.conf
  gateway:   # a stand-in OpenClaw Gateway for the openclaw_node case (spec 041), "gateway" to the clock
    image: python:3.12-alpine
    command: python -u /t/openclaw_gateway.py
    volumes:
      - ../../emulator:/t:ro
    ports:
      - "127.0.0.1:18790:8790"

volumes:
  clock-data:
  starter-data:
