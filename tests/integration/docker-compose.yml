# The integration tests' own emulator: other ports, and storage that `down -v` wipes,
# so each run starts from a blank clock and leaves the development emulator alone.
#   docker compose -p aam-itest -f tests/integration/docker-compose.yml up -d --build
services:
  smartclock:
    build:
      context: ../..
      dockerfile: emulator/Dockerfile
    ports:
      - "127.0.0.1:18000:80"
      - "127.0.0.1:18080:8080"
    volumes:
      - clock-data:/data
  broker:   # an MQTT broker for the mqtt_and_mdns case (spec 025), as "broker" to the clock
    image: eclipse-mosquitto:2.0.18
    command: mosquitto -c /mosquitto-no-auth.conf
  gateway:   # a stand-in OpenClaw Gateway for the openclaw_node case (spec 041), "gateway" to the clock
    image: python:3.12-alpine
    command: python -u /t/fake_gateway.py
    volumes:
      - ./:/t:ro
    ports:
      - "127.0.0.1:18790:8790"

volumes:
  clock-data:
